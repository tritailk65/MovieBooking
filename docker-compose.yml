services:
  postgres:
    image: ankane/pgvector:latest
    container_name: moviebooking-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.6
    container_name: moviebooking-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2
    container_name: moviebooking-rabbitmq
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
  
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    command: ["--config", "/etc/jaeger/jaeger-config.yaml"]
    volumes:
      - ./jaeger-config.yaml:/etc/jaeger/jaeger-config.yaml:ro
    ports:
      - "16686:16686"
      - "13134:13133"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_SECURITY_ENABLED: "false"
      SERVER_HOST: 0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  otel-collector:
    image: docker.elastic.co/elastic-agent/elastic-agent:9.4.0
    command: ["--config=/etc/otelcol/collector-config.yaml"]
    environment:
      ELASTIC_AGENT_OTEL: "true"
    volumes:
      - ./collector-config.yaml:/etc/otelcol/collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    depends_on:
      elasticsearch:
        condition: service_healthy
      jaeger:
        condition: service_started

  catalog-api:
    build:
      context: .
      dockerfile: src/Catalog.API/Dockerfile
    image: moviebooking-catalog:local
    container_name: moviebooking-catalog-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__catalogdb: Host=postgres;Port=5432;Database=catalogdb;Username=postgres;Password=postgres
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__eventbus: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=MovieBooking,deployment.environment.name=MovieBooking
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  seat-api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/Seat.API/Dockerfile
    image: moviebooking-seat:local
    container_name: moviebooking-seat-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Http__Protocols: Http1
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2
      ConnectionStrings__redis: redis:6379
      ConnectionStrings__eventbus: amqp://guest:guest@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=MovieBooking,deployment.environment.name=MovieBooking
    ports:
      - "8082:8080"
    expose:
      - "8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  booking-api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: src/Booking.API/Dockerfile
    image: moviebooking-booking:local
    container_name: moviebooking-booking-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__bookingDb: Host=postgres;Port=5432;Database=bookingdb;Username=postgres;Password=postgres
      ConnectionStrings__sagadb: Host=postgres;Port=5432;Database=sagadb;Username=postgres;Password=postgres
      ConnectionStrings__eventbus: amqp://guest:guest@rabbitmq:5672
      Grpc__SeatUrl: http://seat-api:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=MovieBooking,deployment.environment.name=MovieBooking
    ports:
      - "8083:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      seat-api:
        condition: service_started
      otel-collector:
        condition: service_started

  payment-api:
    build:
      context: .
      dockerfile: src/Payment.API/Dockerfile
    image: moviebooking-payment:local
    container_name: moviebooking-payment-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__EventBus: amqp://guest:guest@rabbitmq:5672
      PaymentOptions__PaymentSucceeded: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=MovieBooking,deployment.environment.name=MovieBooking
    ports:
      - "8084:8080"
    depends_on:
      rabbitmq:
        condition: service_healthy
      otel-collector:
        condition: service_started

  gateway-api:
    build:
      context: .
      dockerfile: src/Gateway.API/Dockerfile
    image: moviebooking-gateway:local
    container_name: moviebooking-gateway-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "false"
      ASPNETCORE_URLS: http://+:8080
      Https__RedirectAtGateway: "false"
      AllowedHosts: localhost;127.0.0.1;10.0.2.2;host.docker.internal
      ForwardedHeaders__KnownIPNetworks__0: 172.16.0.0/12
      ForwardedHeaders__AllowedHosts__0: localhost
      ForwardedHeaders__AllowedHosts__1: 127.0.0.1
      ForwardedHeaders__AllowedHosts__2: 10.0.2.2
      ForwardedHeaders__AllowedHosts__3: host.docker.internal
      ReverseProxy__Clusters__catalog__Destinations__catalog-api__Address: http://catalog-api:8080
      ReverseProxy__Clusters__seat__Destinations__seat-api__Address: http://seat-api:8080
      ReverseProxy__Clusters__booking__Destinations__booking-api__Address: http://booking-api:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=MovieBooking,deployment.environment.name=MovieBooking
    ports:
      - "8080:8080"
    depends_on:
      catalog-api:
        condition: service_started
      seat-api:
        condition: service_started
      booking-api:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  elasticsearch-data:
  postgres-data:
