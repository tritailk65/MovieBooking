name: dotnet-ci

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: MovieBooking

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MovieBooking.slnx

      - name: Build
        run: dotnet build MovieBooking.slnx --configuration Release --no-restore

      - name: Test Catalog
        run: dotnet test tests/Catalog.API.UnitTests/Catalog.API.UnitTests.csproj --configuration Release --no-build --logger trx

      - name: Test Seat
        run: dotnet test tests/Seat.API.UnitTests/Seat.API.UnitTests.csproj --configuration Release --no-build --logger trx

      - name: Test Booking Domain
        run: dotnet test tests/Booking.Domain.UnitTests/Booking.Domain.UnitTests.csproj --configuration Release --no-build --logger trx

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Catalog image
        run: docker build -t moviebooking-catalog:${{ github.sha }} -f MovieBooking/Catalog.API/Dockerfile MovieBooking

      - name: Build Seat image
        run: docker build -t moviebooking-seat:${{ github.sha }} -f MovieBooking/Seat.API/Dockerfile MovieBooking

      - name: Build Booking image
        run: docker build -t moviebooking-booking:${{ github.sha }} -f MovieBooking/Booking.API/Dockerfile MovieBooking

      - name: Build Payment image
        run: docker build -t moviebooking-payment:${{ github.sha }} -f MovieBooking/Payment.API/Dockerfile MovieBooking